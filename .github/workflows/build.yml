name: build

on:
  push:
    branches: [master]
  pull_request:

jobs:
  install:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package
        run: pip install .

      # No test suite yet — this is a smoke test that the package installs,
      # its dependencies resolve, and every module imports cleanly.
      - name: Import check
        run: python -c "import xrt_miner"

      - name: CLI responds
        run: xrt-miner --help
