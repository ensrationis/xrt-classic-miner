[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "xrt-classic-miner"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "web3>=7.0",
    "click>=8.0",
    "pyyaml>=6.0",
    "eth-account>=0.13",
]

[project.scripts]
xrt-miner = "xrt_miner.__main__:cli"

# Without this, setuptools auto-discovery sees both `paper/` and `xrt_miner/`
# as top-level packages and refuses to build.
[tool.setuptools]
packages = ["xrt_miner"]
